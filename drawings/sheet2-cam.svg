or="start" font-weight="normal">2. HOLD-OPEN NOTCH TORQUE ≈ 172 IN-LB.</text><text x="52.0" y="148.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#bcd6ec" text-anchor="start" font-weight="normal">3. DWELL 15°–84° IS CONSTANT RADIUS — ZERO CAM TORQUE IN</text><text x="52.0" y="170.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#bcd6ec" text-anchor="start" font-weight="normal">   ASSIST ZONE; DOOR FEEL THERE IS PURE RIBBON SPRING.</text><text x="52.0" y="192.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#bcd6ec" text-anchor="start" font-weight="normal">4. FLAME-CUT OK; GRIND RAMP AND NOTCH SMOOTH. EDGE BREAK .03.</text><text x="52.0" y="214.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#bcd6ec" text-anchor="start" font-weight="normal">5. CAM KEYED TO SHAFT: VALLEY SEATS WHEN DOOR FULLY CLOSED.</text></svg>