t-size="14" fill="#f5b942" text-anchor="start" font-weight="normal">HINGE PIN Ø1.00, 1.2 OFF SHELL, 3 BUSHED BOSSES</text><line x1="756.1" y1="402.1" x2="906.1" y2="387.1" stroke="#f5b942" stroke-width="1"/><circle cx="756.1" cy="402.1" r="2.5" stroke="#f5b942" stroke-width="1" fill="#f5b942"/><text x="912.1" y="391.1" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#f5b942" text-anchor="start" font-weight="normal">DOOR AT 45° (ASSIST ZONE)</text><line x1="723.2" y1="273.0" x2="783.2" y2="218.0" stroke="#f5b942" stroke-width="1"/><circle cx="723.2" cy="273.0" r="2.5" stroke="#f5b942" stroke-width="1" fill="#f5b942"/><text x="789.2" y="222.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#f5b942" text-anchor="start" font-weight="normal">DOOR AT 90° — HELD BY CAM NOTCH</text><line x1="730.5" y1="642.5" x2="880.5" y2="712.5" stroke="#f5b942" stroke-width="1"/><circle cx="730.5" cy="642.5" r="2.5" stroke="#f5b942" stroke-width="1" fill="#f5b942"/><text x="886.5" y="716.5" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#f5b942" text-anchor="start" font-weight="normal">DOOR, 120° ARC × 30 LG, CLOSED</text><text x="52.0" y="60.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#e8f1fa" text-anchor="start" font-weight="bold">NOTES:</text><text x="52.0" y="82.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#bcd6ec" text-anchor="start" font-weight="normal">1. DOOR + HINGE SHAFT ROTATE TOGETHER; SHAFT RIDES IN 3</text><text x="52.0" y="104.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#bcd6ec" text-anchor="start" font-weight="normal">   GRAPHITE-BRONZE BUSHED WELD BOSSES ON SHELL.</text><text x="52.0" y="126.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#bcd6ec" text-anchor="start" font-weight="normal">2. ALL SPRING HARDWARE OUTBOARD, 2.00 AIR GAP BEHIND</text><text x="52.0" y="148.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#bcd6ec" text-anchor="start" font-weight="normal">   POLISHED SS SHIELD. NO SPRING TOUCHES HOT STEEL.</text><text x="52.0" y="170.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#bcd6ec" text-anchor="start" font-weight="normal">3. CAM DETENT PULLS DOOR SHUT LAST 15° (~105 IN-LB SEAL).</text><text x="52.0" y="192.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#bcd6ec" text-anchor="start" font-weight="normal">4. SPRINGS CARRY ~73% OF DOOR WEIGHT: PEAK HAND EFFORT</text><text x="52.0" y="214.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#bcd6ec" text-anchor="start" font-weight="normal">   ~11 LB AT 20 IN HANDLE VS 37 LB UNASSISTED.</text><text x="52.0" y="236.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#bcd6ec" text-anchor="start" font-weight="normal">5. SHALLOW CAM NOTCH AT 88° PARKS DOOR VERTICAL.</text><text x="52.0" y="258.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#bcd6ec" text-anchor="start" font-weight="normal">6. EXAMPLE CHAMBER 24 OD × 1/4 WALL; SEE DESIGN.MD §4</text><text x="52.0" y="280.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#bcd6ec" text-anchor="start" font-weight="normal">   AND CALCULATOR.HTML TO RESCALE TO ACTUAL BLUEPRINTS.</text></svg>